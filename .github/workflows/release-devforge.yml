# Creates a GitHub Release when a version tag is pushed, or manually for an existing tag.
# Attaches manifest.json for DevPulse / CI.
#
# Tag patterns: GitHub uses glob/fnmatch, NOT regex — use v* (not v[0-9]+...).

name: DevForge release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.112.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  # Use Node 24 for JS actions until runner default flips (see GitHub changelog).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve git ref and tag label
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo -n "$INPUT_TAG" | tr -d '[:space:]')"
            if [[ "$TAG" != v* ]]; then
              echo "::error::Tag must start with v (got: $TAG)"
              exit 1
            fi
            echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GIT_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GIT_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved ref=$(grep '^ref=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full ref avoids ambiguous short refs; workflow_dispatch must not use default-branch SHA only.
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 1
          lfs: false

      - name: Write manifest.json
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::warning::Tag version $VERSION differs from package.json version $PKG_VERSION"
          fi
          REPO="${{ github.repository }}"
          cat > manifest.json <<EOF
          {
            "schema": 1,
            "product": "devforge",
            "version": "${VERSION}",
            "tag": "${TAG}",
            "repository": "https://github.com/${REPO}",
            "releaseUrl": "https://github.com/${REPO}/releases/tag/${TAG}",
            "sourceZipUrl": "https://github.com/${REPO}/archive/refs/tags/${TAG}.zip",
            "sourceTarballUrl": "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz",
            "notes": "Prebuilt reh-web zips can be added as release assets when CI packaging lands; until then builds clone or fetch the source archive by tag."
          }
          EOF
          cat manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
