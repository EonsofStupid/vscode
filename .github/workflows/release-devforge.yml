# Creates a GitHub Release when a version tag is pushed, or manually for an existing tag.
# Attaches manifest.json for DevPulse / CI.
#
# Tag patterns: GitHub uses glob/fnmatch, NOT regex. Use v* (not v[0-9]+...).

name: DevForge release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.112.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: github.ref is default branch — must checkout the tag explicitly.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Write manifest.json
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::warning::Tag version $VERSION differs from package.json version $PKG_VERSION"
          fi
          REPO="${{ github.repository }}"
          cat > manifest.json <<EOF
          {
            "schema": 1,
            "product": "devforge",
            "version": "${VERSION}",
            "tag": "${TAG}",
            "repository": "https://github.com/${REPO}",
            "releaseUrl": "https://github.com/${REPO}/releases/tag/${TAG}",
            "sourceZipUrl": "https://github.com/${REPO}/archive/refs/tags/${TAG}.zip",
            "sourceTarballUrl": "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz",
            "notes": "Prebuilt reh-web zips can be added as release assets when CI packaging lands; until then builds clone or fetch the source archive by tag."
          }
          EOF
          cat manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
